name: flutter_environment_config
description: Plugin that exposes environment variables to your Dart code in Flutter as well as to your native code in iOS and Android. Bring some 12 factor love to your Flutter apps.
version: 1.0.2
homepage: https://github.com/vietvmq/flutter_environment_config

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.10.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  yaml: ^3.1.2

dev_dependencies:
  flutter_lints: ^2.0.0
  test: ^1.21.0

flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.vietvmq.flutter_environment_config
        pluginClass: FlutterEnvironmentConfigPlugin
      ios:
        pluginClass: FlutterEnvironmentConfigPlugin

executables:
  generate: generate

flutter_environment_config:
  output_dir: lib/generated
